<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Bloom — Детская одежда</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Шапка сайта -->
  <header class="header">
    <div class="logo">BABY BLOOM</div>
    <div class="tagline">Одежда и товары для малышей</div>
  </header>

  <!-- Кнопки фильтрации -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Все товары</button>
    <button class="filter-btn" data-filter="in_stock">В наличии</button>
    <button class="filter-btn" data-filter="sale">По акции</button>
    <button class="filter-btn" data-filter="preorder">Предзаказ</button>
  </div>

  <!-- Сетка товаров -->
  <main class="container">
    <div id="product-grid" class="product-grid">
      <!-- Товары загружаются из Supabase через app.js -->
      <p style="text-align:center; grid-column: 1/-1; padding: 40px 0; color: #888;">Загрузка товаров...</p>
    </div>
  </main>

  <!-- Подключение JS -->
  <script src="app.js"></script>
</body>
</html>
