<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Bloom — Панель администратора</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-container { max-width: 600px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 20px; border: 1px solid var(--border-color); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    .form-control { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 14px; background: var(--bg-color); }
    textarea.form-control { resize: vertical; min-height: 80px; }
    input[type="file"].form-control { padding: 8px; cursor: pointer; }
    .btn-submit { width: 100%; background: var(--accent-color); color: #fff; border: none; padding: 14px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-cancel { width: 100%; background: #ccc; color: #000; border: none; padding: 10px; border-radius: 30px; font-size: 14px; margin-top: 8px; cursor: pointer; display: none; }
    .admin-product-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
    .action-btns { display: flex; gap: 8px; }
    .btn-edit { background: #3b82f6; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
    .btn-delete { background: #ff4d4d; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">BABY BLOOM</div>
    <div class="tagline">Админ-панель магазина</div>
  </header>

  <div class="admin-container">
    <h2 id="form-title" style="margin-bottom: 20px; font-size: 18px;">Добавить новый товар</h2>
    <form id="add-product-form">
      <input type="hidden" id="edit-product-id" value="">

      <div class="form-group">
        <label>Название товара</label>
        <input type="text" id="p-title" class="form-control" placeholder="Например: Вязаный комбинезон" required>
      </div>
      
      <div class="form-group">
        <label>Цена (с валютой)</label>
        <input type="text" id="p-price" class="form-control" placeholder="Например: 250 TJS" required>
      </div>

      <div class="form-group">
        <label>Статус наличия</label>
        <select id="p-status" class="form-control">
          <option value="in_stock">🟢 В наличии</option>
          <option value="sale">🔥 По акции</option>
          <option value="preorder">🟡 Предзаказ</option>
        </select>
      </div>

      <div class="form-group">
        <label>Фотографии товара (необязательно)</label>
        <input type="file" id="p-files" class="form-control" accept="image/*" multiple>
        <small id="files-note" style="color: #666; font-size: 11px; display: none;">Оставьте пустым, чтобы сохранить текущие фото</small>
      </div>

      <div class="form-group">
        <label>Описание товара</label>
        <textarea id="p-desc" class="form-control" placeholder="Укажите состав, размеры и детали..."></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">Опубликовать товар</button>
      <button type="button" id="cancel-btn" class="btn-cancel" onclick="resetForm()">Отмена редактирования</button>
    </form>
  </div>

  <div class="admin-container">
    <h2 style="margin-bottom: 20px; font-size: 18px;">Список товаров на сайте</h2>
    <div id="admin-list">Загрузка...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://pwkwtulyvwvxddtniidg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_aVaAogTKMyIeSX181EF2nA_CxxU-1eH";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];

    async function loadAdminProducts() {
      const listEl = document.getElementById('admin-list');
      const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
      
      if (error) { listEl.innerText = "Ошибка загрузки: " + error.message; return; }
      if (!data || !data.length) { listEl.innerText = "Товаров пока нет"; return; }

      allProducts = data;
      listEl.innerHTML = data.map(p => {
        let statusText = 'В наличии';
        if (p.status === 'sale') statusText = 'По акции';
        if (p.status === 'preorder') statusText = 'Предзаказ';

        return `
          <div class="admin-product-item">
            <div>
              <strong>${p.title}</strong> — ${p.price} (${statusText})
            </div>
            <div class="action-btns">
              <button class="btn-edit" onclick="editProduct(${p.id})">Изм.</button>
              <button class="btn-delete" onclick="deleteProduct(${p.id})">Уд.</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function editProduct(id) {
      const product = allProducts.find(p => p.id === id);
      if (!product) return;

      document.getElementById('edit-product-id').value = product.id;
      document.getElementById('p-title').value = product.title || '';
      document.getElementById('p-price').value = product.price || '';
      document.getElementById('p-status').value = product.status || 'in_stock';
      document.getElementById('p-desc').value = product.description || '';

      document.getElementById('form-title').innerText = "Редактирование товара";
      document.getElementById('submit-btn').innerText = "Сохранить изменения";
      document.getElementById('cancel-btn').style.display = "block";
      document.getElementById('files-note').style.display = "block";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('edit-product-id').value = '';
      document.getElementById('add-product-form').reset();
      document.getElementById('form-title').innerText = "Добавить новый товар";
      document.getElementById('submit-btn').innerText = "Опубликовать товар";
      document.getElementById('cancel-btn').style.display = "none";
      document.getElementById('files-note').style.display = "none";
    }

    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const fileInput = document.getElementById('p-files');
      const files = fileInput.files;
      const editId = document.getElementById('edit-product-id').value;

      submitBtn.disabled = true;
      submitBtn.innerText = "Сохранение...";

      try {
        let uploadedImageUrls = [];

        if (editId) {
          const currentProd = allProducts.find(p => p.id == editId);
          uploadedImageUrls = currentProd ? (currentProd.images || []) : [];
        }

        if (files && files.length > 0) {
          submitBtn.innerText = "Загрузка фото...";
          uploadedImageUrls = []; // Перезаписываем фото при выгрузке новых
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

            const { error: uploadError } = await supabaseClient.storage
              .from('product-images')
              .upload(fileName, file);

            if (uploadError) throw uploadError;

            const { data: urlData } = supabaseClient.storage
              .from('product-images')
              .getPublicUrl(fileName);

            uploadedImageUrls.push(urlData.publicUrl);
          }
        }

        const productData = {
          title: document.getElementById('p-title').value,
          price: document.getElementById('p-price').value,
          status: document.getElementById('p-status').value,
          images: uploadedImageUrls,
          description: document.getElementById('p-desc').value
        };

        if (editId) {
          const { error: updateError } = await supabaseClient
            .from('products')
            .update(productData)
            .eq('id', editId);
          if (updateError) throw updateError;
          alert("Товар успешно обновлен!");
        } else {
          const { error: insertError } = await supabaseClient
            .from('products')
            .insert([productData]);
          if (insertError) throw insertError;
          alert("Товар успешно добавлен!");
        }

        resetForm();
        loadAdminProducts();

      } catch (err) {
        alert("Ошибка: " + err.message);
        console.error(err);
      } finally {
        submitBtn.disabled = false;
      }
    });

    async function deleteProduct(id) {
      if (confirm("Точно удалить этот товар?")) {
        await supabaseClient.from('products').delete().eq('id', id);
        loadAdminProducts();
      }
    }

    loadAdminProducts();
  </script>
</body>
</html>
